# RTAB-Map tuned like slam_nav.yaml / slam_toolbox:
# 3D LiDAR (/scan_cloud) + RGB-D depth camera fusion, GPS prior recording,
# ICP scan matching on the 3D lidar, conservative visual loops, 5 cm grid.
# Launch overrides Reg/Force3DoF, Optimizer/GravitySigma, Grid/NormalsSegmentation,
# and wait_imu_to_init when force_3dof:=false (static hills).
/**:
  ros__parameters:
    frame_id: base_footprint
    odom_frame_id: odom
    map_frame_id: map
    subscribe_rgbd: true
    subscribe_rgb: false
    subscribe_depth: false
    subscribe_scan: false
    subscribe_scan_cloud: true
    scan_cloud_max_points: 15000
    subscribe_odom_info: false
    use_action_for_goal: true
    approx_sync: true
    approx_sync_max_interval: 0.10
    topic_queue_size: 30
    sync_queue_size: 30
    queue_size: 30

    # Publish 2D occupancy grid (/map) and use GPS fixes (/gps/fix) to filter loop closures
    RGBD/CreateOccupancyGrid: "true"
    map_always_update: true
    Rtabmap/LoopGPS: "true"
    RGBD/LocalRadius: "10"

    # slam_toolbox: minimum_travel_distance / heading 0.1, ~1.5 s map updates
    Rtabmap/DetectionRate: "2.5"
    RGBD/LinearUpdate: "0.10"
    RGBD/AngularUpdate: "0.10"
    RGBD/LinearSpeedUpdate: "0.1"
    RGBD/AngularSpeedUpdate: "0.1"

    # Scan-match neighbor links on 3D LiDAR point cloud (/scan_cloud)
    RGBD/NeighborLinkRefining: "true"
    RGBD/ProximityBySpace: "true"
    RGBD/ProximityMaxGraphDepth: "0"
    RGBD/ProximityPathMaxNeighbors: "1"
    RGBD/OptimizeFromGraphEnd: "false"
    Reg/Strategy: "1"
    Icp/Strategy: "1"
    Icp/VoxelSize: "0.05"
    Icp/MaxCorrespondenceDistance: "0.30"
    Icp/Iterations: "30"
    Icp/Epsilon: "0.001"
    Icp/CorrespondenceRatio: "0.01"
    Icp/PointToPlane: "false"

    # Wood / grass walls false-match easily. slam_toolbox has do_loop_closing: false.
    # Keep proximity (lidar) loops; make visual loops strict.
    RGBD/LoopClosureReextractFeatures: "true"
    Rtabmap/LoopThr: "0.20"
    Vis/MinInliers: "20"
    Vis/InlierDistance: "0.05"

    # 2D occupancy fused from BOTH 3D lidar (/scan_cloud) and RGB-D depth camera (Grid/Sensor=2)
    Grid/Sensor: "2"
    Grid/3D: "false"
    Grid/MapFrameProjection: "false"
    Grid/CellSize: "0.05"
    Grid/RangeMax: "20.0"
    Grid/RangeMin: "0.20"
    Grid/RayTracing: "true"
    Grid/MaxObstacleHeight: "2.0"
    Grid/MaxGroundHeight: "0.15"
    Grid/MinGroundHeight: "-1.0"
    Grid/FootprintLength: "0.26"
    Grid/FootprintWidth: "0.22"
    Grid/FootprintHeight: "0.30"

    # Flat-floor default; launch sets these for hills
    Reg/Force3DoF: "true"
    Optimizer/GravitySigma: "0"
    subscribe_imu: true
