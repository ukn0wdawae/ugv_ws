# Nav2 for the Coqui survey. Derived from ugv_gazebo/param/legacy_code/slam_nav_traversability.yaml:
#  - global costmap: no static map; 50 m rolling window at 10 cm built live from the traversability
#    node (lethal steps/slopes/vegetation marked, traversable ground cleared)
#  - goal yaw tolerance 2*pi: goals are positions; the pan-tilt camera does the aiming, so the robot
#    never has to turn on the spot at a goal (that failed on slopes)
# Environment-specific overrides go in config/profiles/<env>.yaml (key `nav2:`), merged on top at launch.
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    - nav2_is_battery_charging_condition_bt_node
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugin: goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.28
      yaw_goal_tolerance: 6.28
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: -0.15
      min_vel_y: 0.0
      max_vel_x: 0.65
      max_vel_y: 0.0
      max_vel_theta: 2.2
      min_speed_xy: 0.0
      max_speed_xy: 0.65
      min_speed_theta: 0.0
      acc_lim_x: 2.0
      acc_lim_y: 0.0
      acc_lim_theta: 10.0
      decel_lim_x: -2.0
      decel_lim_y: 0.0
      decel_lim_theta: -10.0
      vx_samples: 14
      vy_samples: 0
      vtheta_samples: 25
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.28
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - Oscillation
      - ObstacleFootprint
      - PathAlign
      - PathDist
      - GoalDist
      - PreferForward
      ObstacleFootprint.scale: 0.02
      ObstacleFootprint.sum_scores: false
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.30
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      PreferForward.penalty: 15.0
      PreferForward.strafe_x: 0.1
      PreferForward.strafe_theta: 0.2
      PreferForward.theta_scale: 0.0
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      transform_tolerance: 0.2
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[ [0.15, 0.12], [0.15, -0.12], [-0.15, -0.12], [-0.15, 0.12] ]"
      # StaticLayer runs FIRST with use_maximum: false, then obstacle_layer max-combines on top
      # (combination_method: 1). This prevents StaticLayer NO_INFORMATION (255) from winning std::max
      # and erasing obstacle_layer cells, while keeping graded slope costs intact.
      use_maximum: false
      trinary_costmap: false
      lethal_cost_threshold: 100
      plugins:
      - traversability_layer
      - obstacle_layer
      - inflation_layer
      traversability_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /terrain_traversability/grid
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        use_maximum: false
        trinary_costmap: false
        lethal_cost_threshold: 100
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 6.0
        inflation_radius: 0.32
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        max_obstacle_height: 1000.0
        enabled: true
        combination_method: 1
        observation_sources: obstacles_cloud ground_cloud
        footprint_clearing_enabled: true
        obstacles_cloud:
          topic: /terrain_traversability/obstacles
          min_obstacle_height: -10.0
          max_obstacle_height: 20.0
          clearing: true
          marking: true
          data_type: PointCloud2
          expected_update_rate: 1.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.2
        ground_cloud:
          topic: /terrain_traversability/ground
          min_obstacle_height: -10.0
          max_obstacle_height: 20.0
          clearing: true
          marking: false
          data_type: PointCloud2
          expected_update_rate: 1.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.2
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      transform_tolerance: 0.2
      footprint: "[ [0.15, 0.12], [0.15, -0.12], [-0.15, -0.12], [-0.15, 0.12] ]"
      resolution: 0.1
      track_unknown_space: true
      # StaticLayer MUST run BEFORE obstacle_layer with use_maximum: false:
      # in Nav2 Humble, StaticLayer rolling-window max uses std::max(cost, master) where
      # NO_INFORMATION=255 > LETHAL=254 > FREE=0, which erased free space and obstacles.
      # Running traversability_layer first (overwrite) and obstacle_layer second (combination_method: 1
      # = CostmapLayer::updateWithMax, which skips NO_INFORMATION and replaces master=255 with 0/254)
      # preserves unknown frontiers, raytraced free space, graded slope costs, and lethal obstacles.
      use_maximum: false
      trinary_costmap: false
      lethal_cost_threshold: 100
      plugins:
      - traversability_layer
      - obstacle_layer
      - inflation_layer
      traversability_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /terrain_traversability/global_grid
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        use_maximum: false
        track_unknown_space: true
        trinary_costmap: false
        lethal_cost_threshold: 100
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        max_obstacle_height: 1000.0
        enabled: true
        combination_method: 1
        observation_sources: obstacles_cloud ground_cloud
        footprint_clearing_enabled: true
        obstacles_cloud:
          topic: /terrain_traversability/obstacles
          min_obstacle_height: -10.0
          max_obstacle_height: 20.0
          clearing: true
          marking: true
          data_type: PointCloud2
          expected_update_rate: 1.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
        ground_cloud:
          topic: /terrain_traversability/ground
          min_obstacle_height: -10.0
          max_obstacle_height: 20.0
          clearing: true
          marking: false
          data_type: PointCloud2
          expected_update_rate: 1.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 6.0
        inflation_radius: 0.32
      always_send_full_costmap: true
      rolling_window: true
      width: 50
      height: 50
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: true
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.3
      use_astar: false
      allow_unknown: true
      use_final_approach_orientation: true
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
robot_state_publisher:
  ros__parameters:
    use_sim_time: true
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.75
    - 0.0
    - 2.5
    min_velocity:
    - -0.4
    - 0.0
    - -2.5
    max_accel:
    - 1.5
    - 0.0
    - 4.5
    max_decel:
    - -1.5
    - 0.0
    - -4.5
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    transform_tolerance: 0.2
    source_timeout: 2.5
    base_shift_correction: true
    stop_pub_timeout: 1.5
    polygons:
    - PolygonStop
    - PolygonSlow
    PolygonStop:
      type: polygon
      points: [0.18, 0.13, 0.18, -0.13, -0.17, -0.13, -0.17, 0.13]
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true
    PolygonSlow:
      type: polygon
      points: [0.50, 0.20, 0.50, -0.20, -0.22, -0.20, -0.22, 0.20]
      action_type: slowdown
      max_points: 5
      slowdown_ratio: 0.45
      visualize: true
      polygon_pub_topic: polygon_slowdown
      enabled: true
    observation_sources:
    - obstacles_cloud
    obstacles_cloud:
      type: pointcloud
      topic: /terrain_traversability/obstacles
      min_height: -15.0
      max_height: 25.0
      enabled: true
