# Registry of navigation styles benchmarked by /tests.
# Add a new entry here whenever testing a new controller (MPPI, RPP, TEB, DWB),
# planner (NavFn, Smac2D, SmacHybrid), Behavior Tree, or traversability tuning.
styles:
  survey_dwb_default:
    description: "Default Coqui survey stack: DWB + ObstacleFootprint + Commit-to-Path BT + Global Slope Layer + Collision Monitor"
    nav2_params: src/ugv_main/ugv_coqui_behavior/config/nav2_survey_base.yaml
    bt_xml: src/ugv_main/ugv_coqui_behavior/config/bt_commit_to_path.xml
    traversability_params: src/ugv_main/ugv_traversability/config/traversability.yaml
    survey_params: src/ugv_main/ugv_coqui_behavior/config/survey_base.yaml
    localization: ekf
    require_global_slope_layer: true
    require_collision_monitor: true

  slam_nav_traversability:
    description: "Standalone SLAM + Nav2 traversability config (ugv_gazebo/param/slam_nav_traversability.yaml)"
    nav2_params: src/ugv_main/ugv_gazebo/param/slam_nav_traversability.yaml
    bt_xml: src/ugv_main/ugv_coqui_behavior/config/bt_commit_to_path.xml
    traversability_params: src/ugv_main/ugv_traversability/config/traversability.yaml
    survey_params: src/ugv_main/ugv_coqui_behavior/config/survey_base.yaml
    localization: slam
    require_global_slope_layer: false
    require_collision_monitor: false
