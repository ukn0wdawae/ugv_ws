# Local state estimation without GPS: wheel odometry + IMU -> /odom + TF odom -> base_footprint, in full 3D.
#
# 3D, not two_d_mode: on this terrain the 2D filter integrated the gyro about the wrong axis (19 deg heading drift over one
# mission, position 4.7 m off), and it pinned the robot to a flat plane, so RViz drew the terrain above it and every arrow
# and sound ray below the ground. With attitude and height in the TF the robot sits on the terrain it measures.
# Replay of one recorded mission (144 m): 2D mean 1.42 m / max 4.7 m, 3D mean 0.44 m / max 1.2 m. What is left is drift;
# lidar_localizer (map -> odom) removes it (0.1 m).
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: false
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Body velocity from wheel_odom_relay: vx measured, vy and vz ~ 0 (a wheeled robot does not fly or slide sideways)
    odom0: /wheel/odom_3d
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  true,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 20

    # Madgwick attitude (roll, pitch; its yaw is free) and the gyro
    imu0: /imu
    imu0_config: [false, false, false,
                  true,  true,  false,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 40
    imu0_remove_gravitational_acceleration: true
