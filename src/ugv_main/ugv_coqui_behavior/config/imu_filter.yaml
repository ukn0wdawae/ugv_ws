# Madgwick AHRS filter: estimates attitude quaternion strictly from noisy gyroscope + accelerometer
# (/imu/raw -> /imu) instead of trusting Gazebo's ground-truth orientation quaternion.
imu_filter_madgwick:
  ros__parameters:
    use_sim_time: true
    use_mag: false
    publish_tf: false
    world_frame: enu
    fixed_frame: odom
    gain: 0.05
    zeta: 0.002
    stateless: false
    remove_gravity_vector: false
    orientation_stddev: 0.015
