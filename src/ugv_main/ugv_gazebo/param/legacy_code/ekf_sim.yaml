ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    odom0: /wheel/odom
    odom0_config: [false, false, false,  false, false, false,
                   true,  false, false,  false, false, false,
                   false, false, false]      # forward velocity only
    imu0: /imu
    imu0_config: [false, false, false,  false, false, true,
                  false, false, false,  false, false, true,
                  false, false, false]       # yaw + yaw rate
    imu0_relative: true