# Coqui Frog Acoustic Environments Configuration (Multi-Frog Map Layout — No Scenario Tag)
# In each compact environment (park, lake, hill, forest), 5 Coqui frogs are placed
# simultaneously across the map in realistic habitats:
#   1. frog_open:          In an open clearing (small ~4.8cm frog on a mossy stone perch with obstacle collision)
#   2. frog_behind_tree:   Behind a solid tree trunk (robot must plan around the tree via Nav2 to get a clear view)
#   3. frog_inside_bush:   Inside a dense untraversable bush thicket (robot stops at bush boundary & aims camera)
#   4. frog_behind_object: Behind a solid object (bench, boulder, rock outcrop, or fallen log)
#   5. frog_on_tree:       Perched ~1.55m high on a tree branch (robot stands back & tilts PTZ camera upward)

environments:
  park:
    spawn: [47.0, 1.0, 3.03, 3.05]
    frogs:
      - id: "frog_open"
        name: "coqui_frog_open"
