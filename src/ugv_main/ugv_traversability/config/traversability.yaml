# Terrain traversability node parameters.
# Thresholds are derived from the ugv_pro_audio / ugv_rover geometry:
#   wheel radius 0.040 m, chassis clearance 0.060 m, wheel base 0.171 m, track 0.175 m.
terrain_traversability:
  ros__parameters:
    fixed_frame: odom
    robot_frame: base_footprint

    # Inputs. The 16-ch lidar (/scan_cloud) only sees the ground beyond ~0.85 m
    # (lowest beam -10 deg, mounted ~0.15 m high), so the depth camera is added
    # for the near field.  Strides subsample each cloud (depth: every 4th
    # pixel in u and v -> ~19k points).
    cloud_topics: ["/scan_cloud", "/camera/points"]
    cloud_strides: [1, 4]
    # 'reliable' for the 9.8 MB depth clouds (best-effort drops them when fragmented)
    cloud_qos: ["best_effort", "reliable"]
    # Per-topic max range (0 = max_range).  The camera only fills the lidar's near-field gap:
    # beyond ~2 m its ground samples are sparse and biased (measured +1..3 cm at 2-6 m in sim),
    # which created false 'steps' where camera and lidar cells meet.
    cloud_max_ranges: [0.0, 2.0]

    # 2D wheel odometry has no z/roll/pitch: rebuild a 3D pose from IMU
    # roll/pitch and integrated height. Set false if your odom TF is already 3D.
    imu_topic: /imu
    use_imu_attitude: true

    # Point filtering
    min_range: 0.25
    max_range: 6.0
    max_height_above_robot: 0.9     # ignore canopy / overhangs higher than this
    max_depth_below_robot: 2.0
    self_filter_box: [-0.16, 0.16, -0.13, 0.13, 0.35]   # robot body (x0,x1,y0,y1,zmax) in robot_frame
    footprint_radius: 0.12          # cells under the robot are ground (on the robot's base plane)
    footprint_follow_slope: true    # false = old flat disc at robot height
    exact_pose: true                # place each cloud with the pose AT ITS STAMP (park + retry), never the latest
    pose_wait_s: 0.3                # drop a parked cloud after this long

    # Map
    map_length: 8.0                 # m (square, robot-centred)
    resolution: 0.05                # m
    fusion_alpha: 0.4               # exponential height fusion weight of a new scan
    max_age: 20.0                   # s, forget cells not seen for this long
    recenter_distance: 0.5          # m

    # Features
    plane_radius: 0.15              # m, half-size of plane-fit window (slope / roughness)
    step_radius: 0.10               # m, half-size of step window
    min_valid_ratio: 0.3

    # Cost thresholds: below *_safe -> 0, at/above *_critical -> lethal (100)
    slope_safe_deg: 12.0
    slope_critical_deg: 25.0
    step_safe: 0.02
    step_critical: 0.045
    roughness_safe: 0.010
    roughness_critical: 0.030
    weight_slope: 1.0
    weight_step: 1.0
    weight_roughness: 1.0

    # Outputs
    publish_rate: 5.0
    obstacle_cost_threshold: 100    # cells >= this go to ~/obstacles (Nav2 marking)
    ground_cloud_stride: 2          # subsample ~/ground (Nav2 clearing)
